<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Acerta AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login">

  <div class="pagina-login-textura"></div>

  <div class="pagina-login-assinatura" aria-hidden="true">
    <svg viewBox="0 0 400 400">
      <circle class="bl-aro" cx="200" cy="200" r="180"/>
      <circle class="bl-aro" cx="200" cy="200" r="140"/>
      <circle class="bl-aro-gold" cx="200" cy="200" r="100"/>
      <circle class="bl-aro" cx="200" cy="200" r="60"/>

      <line class="bl-aro" x1="200" y1="6" x2="200" y2="42"/>
      <line class="bl-aro" x1="200" y1="358" x2="200" y2="394"/>
      <line class="bl-aro" x1="6" y1="200" x2="42" y2="200"/>
      <line class="bl-aro" x1="358" y1="200" x2="394" y2="200"/>

      <g transform="translate(200,200)">
        <polygon class="bl-lamina" points="0.0,-38.0 34.0,-58.0 20.0,-12.0"/>
        <polygon class="bl-lamina" points="26.9,-26.9 65.1,-17.0 22.6,5.7"/>
        <polygon class="bl-lamina" points="38.0,-0.0 58.0,34.0 12.0,20.0"/>
        <polygon class="bl-lamina" points="26.9,26.9 17.0,65.1 -5.7,22.6"/>
        <polygon class="bl-lamina" points="0.0,38.0 -34.0,58.0 -20.0,12.0"/>
        <polygon class="bl-lamina" points="-26.9,26.9 -65.1,17.0 -22.6,-5.7"/>
        <polygon class="bl-lamina" points="-38.0,0.0 -58.0,-34.0 -12.0,-20.0"/>
        <polygon class="bl-lamina" points="-26.9,-26.9 -17.0,-65.1 5.7,-22.6"/>
      </g>

      <g class="bl-linha">
        <path d="M 240 130 L 268 108 L 296 118"/>
        <path d="M 250 150 L 300 150 L 322 168"/>
        <path d="M 236 168 L 280 190"/>
      </g>
      <circle class="bl-ponto" cx="268" cy="108" r="4"/>
      <circle class="bl-ponto" cx="296" cy="118" r="3"/>
      <circle class="bl-ponto" cx="322" cy="168" r="3.5"/>
      <circle class="bl-ponto" cx="280" cy="190" r="3"/>

      <line class="bl-flecha" x1="330" y1="70" x2="212" y2="188"/>
      <polygon class="bl-flecha-ponta" points="330,70 314,72 328,86"/>

      <circle class="bl-centro" cx="200" cy="200" r="7"/>
    </svg>
  </div>

  <main class="login-container">
    <div class="login-marca-topo">
      <img src="img/logo-fundo.jpg" alt="">
      <div>
        <strong>ACERTA<span>AI</span></strong>
        <small>O alvo é a sua aprovação</small>
      </div>
    </div>

    <span class="login-eyebrow">Preparação para fotógrafo de concursos</span>

    <div class="login-card">
      <div class="login-cabecalho">
        <h1>Criar nova senha</h1>
        <p>Escolha uma nova senha para sua conta.</p>
      </div>

      <form id="form-redefinir" novalidate>
        <div class="mb-3">
          <label for="nova-senha" class="form-label">Nova senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="nova-senha" minlength="8" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="confirmar-senha" class="form-label">Confirmar nova senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="confirmar-senha" minlength="8" required>
          </div>
        </div>

        <div id="alerta-redefinir" class="alert d-none" role="alert"></div>

        <button type="submit" class="btn btn-entrar w-100" id="btn-redefinir">
          <span class="spinner-border spinner-border-sm d-none" id="spinner-redefinir"></span>
          <span id="texto-redefinir">Salvar nova senha</span>
        </button>
      </form>

      <p class="login-rodape">
        <a href="index.html">Voltar para o login</a>
      </p>
    </div>

    <div class="login-leituras">
      <div class="login-leitura"><span>1000+</span><span>Questões reais</span></div>
      <div class="login-leitura"><span>22+</span><span>Temas cobertos</span></div>
      <div class="login-leitura"><span>f/1.0</span><span>Foco total</span></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/redefinir-senha.js"></script>
</body>
</html>
