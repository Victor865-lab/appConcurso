# Exemplo de configuração do nginx como proxy reverso para a API Concursos.
#
# Instalação:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/api-concursos
#   sudo ln -s /etc/nginx/sites-available/api-concursos /etc/nginx/sites-enabled/
#   sudo nano /etc/nginx/sites-available/api-concursos   # trocar SEU_DOMINIO.com.br
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois, para gerar o HTTPS automaticamente (recomendado):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d SEU_DOMINIO.com.br -d www.SEU_DOMINIO.com.br
# O certbot reescreve este arquivo sozinho, adicionando o bloco de SSL
# e o redirecionamento de HTTP para HTTPS — não precisa fazer isso à mão.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO.com.br www.SEU_DOMINIO.com.br;

    # Corpo de requisição um pouco maior que o limite da própria API (1mb),
    # para o nginx nunca ser o primeiro a rejeitar.
    client_max_body_size 2m;

    access_log /var/log/nginx/api-concursos.access.log;
    error_log  /var/log/nginx/api-concursos.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Necessários para TRUST_PROXY=true funcionar corretamente
        # (rate limit e logs enxergarem o IP real do cliente, não o do nginx).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
